services:
  backend:
    build: ./backend
    container_name: diabetes-backend
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: diabetes-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
